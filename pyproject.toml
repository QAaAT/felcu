[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "felcu"
version = "0.1.0"
description = "Fourier-extension coefficients for LCU block encodings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Peter Brearley" },
    { name = "Thomas L. Howarth" },
    { name = "Ben Adcock" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["numpy>=2.0"]

[project.urls]
Homepage = "https://github.com/QAaAT/felcu"
Documentation = "https://qaaat.github.io/felcu/"
Repository = "https://github.com/QAaAT/felcu"
Issues = "https://github.com/QAaAT/felcu/issues"
Paper = "https://arxiv.org/abs/2601.18024"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff==0.17.1"]
plots = ["matplotlib>=3.7"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[tool.setuptools.packages.find]
where = ["."]
include = ["felcu*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.format]
# Leave code blocks in the docs alone: they contain pymdownx snippet markers.
exclude = ["*.md"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, NumPy deprecations
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
# zip(..., strict=...) adds noise for the many equal-length numeric zips
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["felcu", "_style"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: one helper or internal component in isolation",
    "interface: the public contract: validation, defaults, result fields, selection, saving and loading",
    "convergence: mathematical correctness: targets met, convergence rates and subnormalisation bounds",
    "regression: compares solver output with the saved references in tests/data/regression",
]
