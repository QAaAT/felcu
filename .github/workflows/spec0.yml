name: SPEC 0

# Monthly check of the supported Python and dependency versions against
# SPEC 0 (see "Supported versions" in docs/development.md).  When a floor is
# due to rise, or a new Python release is missing from CI, it updates the
# files on the spec0-update branch and opens a pull request.  While that pull
# request is open, later updates are added on top of it, so fixes pushed to
# the branch are kept.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH: spec0-update
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Start from the open pull request if there is one, otherwise from main.
      - name: Check out the update branch
        id: branch
        run: |
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          echo "pr=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then
            git fetch --quiet origin "$BRANCH:$BRANCH"
            git switch "$BRANCH"
          else
            git switch --create "$BRANCH"
          fi

      - name: Bring the versions up to SPEC 0
        id: update
        run: python .github/scripts/spec0_check.py --apply --report "$RUNNER_TEMP/spec0.md"

      - name: Open or update the pull request
        if: steps.update.outputs.due == 'true'
        env:
          PR: ${{ steps.branch.outputs.pr }}
          TITLE: "Raise the supported versions to SPEC 0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --quiet --file - <<EOF
          $TITLE

          $(cat "$RUNNER_TEMP/spec0.md")
          EOF

          if [ -n "$PR" ]; then
            git push origin "$BRANCH"
            gh pr edit "$PR" --body-file "$RUNNER_TEMP/spec0.md"
          else
            # Any spec0-update left by a merged or closed pull request is replaced.
            git push --force origin "$BRANCH"
            gh pr create --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/spec0.md"
          fi

          # Pushes made with GITHUB_TOKEN do not trigger other workflows, but a
          # manual run does, and its checks show on the pull request.
          gh workflow run ci.yml --ref "$BRANCH"
