name: Docs

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and docs dependencies
        run: pip install -e ".[docs]"

      - name: Build site
        run: mkdocs build --strict

      # Pages deployment is paused: the site is still built (and checked with
      # --strict) but not uploaded or deployed.  To resume, restore
      # `if: github.event_name != 'pull_request'` here and on the deploy job.
      - uses: actions/upload-pages-artifact@v3
        if: false
        with:
          path: site

  deploy:
    if: false  # paused; see the note on the upload step above
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
