name: Docs

# Only build (and, on main, deploy) when something the site is built from
# changes: the pages, the docstrings behind the API reference, and the example
# scripts the Examples page includes.  Run it by hand from the Actions tab
# otherwise.
on:
  push:
    branches: ["main"]
    paths: &site-sources
      - "docs/**"
      - "mkdocs.yml"
      - "felcu/**"
      - "examples/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *site-sources
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and docs dependencies
        run: pip install -e ".[docs]"

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
