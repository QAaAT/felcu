name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  # Lets the SPEC 0 workflow run CI on the pull requests it opens.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch cancels its still-running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The ruff version is pinned once, in the dev extra.
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check --diff .

  # Everything else waits for lint, so a style failure stops the run early.
  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows ship different BLAS/LAPACK builds from Linux.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      # One step per test category (see tests/conftest.py), lowest layer first:
      # a failure low down usually explains the ones above it.  Every step runs
      # even if an earlier one failed, so one failure cannot hide another, and
      # each appends to the same coverage data.
      - name: Run unit tests
        run: python -m pytest tests/ -v -m unit --cov=felcu --cov-report=

      - name: Run interface tests
        if: ${{ !cancelled() }}
        run: python -m pytest tests/ -v -m interface --cov=felcu --cov-append --cov-report=

      - name: Run convergence tests
        if: ${{ !cancelled() }}
        run: python -m pytest tests/ -v -m convergence --cov=felcu --cov-append --cov-report=

      - name: Run regression tests
        id: regression
        if: ${{ !cancelled() }}
        run: python -m pytest tests/ -v -m regression --cov=felcu --cov-append --cov-report=term-missing

      # On drift, save what this platform computes, so it can be diffed
      # against tests/data/regression without reproducing it locally.
      - name: Save this platform's regression results
        if: ${{ failure() && steps.regression.outcome == 'failure' }}
        run: python tests/regression_cases.py "${{ runner.temp }}/regression-results"

      - name: Upload this platform's regression results
        if: ${{ failure() && steps.regression.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: regression-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/regression-results

  test-min-deps:
    # Oldest supported Python with the oldest supported NumPy, so the floor in
    # pyproject.toml stays honest.  The matrix above always gets the newest
    # NumPy, so nothing else checks this.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install package with minimum dependencies
        run: pip install -e ".[dev]" "numpy==2.2.*"

      - name: Run unit tests
        run: python -m pytest tests/ -v -m unit

      - name: Run interface tests
        if: ${{ !cancelled() }}
        run: python -m pytest tests/ -v -m interface

      - name: Run convergence tests
        if: ${{ !cancelled() }}
        run: python -m pytest tests/ -v -m convergence

      - name: Run regression tests
        id: regression
        if: ${{ !cancelled() }}
        run: python -m pytest tests/ -v -m regression

      - name: Save this platform's regression results
        if: ${{ failure() && steps.regression.outcome == 'failure' }}
        run: python tests/regression_cases.py "${{ runner.temp }}/regression-results"

      - name: Upload this platform's regression results
        if: ${{ failure() && steps.regression.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: regression-results-min-deps
          path: ${{ runner.temp }}/regression-results

  # Every other job uses an editable install, which never checks that the
  # built package is complete.  Build the sdist and wheel as a release would,
  # install the wheel, and run the test suite shipped in the sdist against it
  # from outside the checkout, so felcu can only come from site-packages and
  # a file missing from either archive fails here rather than on release.
  install:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build --outdir "${{ runner.temp }}/dist"
          twine check --strict "${{ runner.temp }}"/dist/*

      - name: Run the sdist's tests against the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          pip install dist/*.whl pytest
          mkdir sdist run && tar -xzf dist/*.tar.gz -C sdist --strip-components=1
          # Only the tests and pytest config: the sdist's own felcu/ must not
          # shadow the installed wheel.
          cp -r sdist/tests sdist/pyproject.toml run/
          cd run
          python -c "import felcu; print(felcu.__file__)" | grep site-packages
          python -c "import pathlib, felcu; assert (pathlib.Path(felcu.__file__).parent / 'py.typed').exists()"
          python -m pytest tests/ -q -p no:cacheprovider

  # Runs last: there is no point running the examples against a broken library.
  examples:
    needs: [test, test-min-deps, install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install package and plotting dependencies
        run: pip install -e ".[plots]"

      # The plot scripts save PNGs to the working directory, so run everything
      # from a scratch directory.
      - name: Run examples
        env:
          MPLBACKEND: Agg
        working-directory: ${{ runner.temp }}
        run: |
          for script in "$GITHUB_WORKSPACE"/examples/*/[0-9]*.py; do
            echo "::group::${script#"$GITHUB_WORKSPACE"/}"
            python "$script"
            echo "::endgroup::"
          done
