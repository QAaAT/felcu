name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# A new push to a branch cancels its still-running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The ruff version is pinned once, in the dev extra.
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check --diff .

  # Everything else waits for lint, so a style failure stops the run early.
  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows ship different BLAS/LAPACK builds from Linux.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --cov=felcu --cov-report=term-missing

  test-min-deps:
    # Oldest supported Python with the oldest supported NumPy, so the floor in
    # pyproject.toml stays honest.  The matrix above always gets the newest
    # NumPy, so nothing else checks this.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package with minimum dependencies
        run: pip install -e ".[dev]" "numpy==2.0.*"

      - name: Run tests
        run: python -m pytest tests/ -v

  # Runs last: there is no point running the examples against a broken library.
  examples:
    needs: [test, test-min-deps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and plotting dependencies
        run: pip install -e ".[plots]"

      # The plot scripts save PNGs to the working directory, so run everything
      # from a scratch directory.
      - name: Run examples
        env:
          MPLBACKEND: Agg
        working-directory: ${{ runner.temp }}
        run: |
          for script in "$GITHUB_WORKSPACE"/examples/*/[0-9]*.py; do
            echo "::group::${script#"$GITHUB_WORKSPACE"/}"
            python "$script"
            echo "::endgroup::"
          done
